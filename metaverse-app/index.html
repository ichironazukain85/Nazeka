<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>METAPA - バーチャル空間</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Lobby Screen -->
    <div id="lobby-screen">
        <div class="lobby-container">
            <h1 class="lobby-title">METAPA</h1>
            <p class="lobby-subtitle">みんなで楽しむバーチャル空間</p>
            <div class="lobby-form">
                <label for="username-input">なまえ</label>
                <input type="text" id="username-input" placeholder="なまえを入れてね..." maxlength="20" autocomplete="off">
                <label for="avatar-color">アバターのいろ</label>
                <div class="color-picker" id="avatar-color">
                    <div class="color-option selected" data-color="#f8bbd0" style="background:#f8bbd0"></div>
                    <div class="color-option" data-color="#b2dfdb" style="background:#b2dfdb"></div>
                    <div class="color-option" data-color="#fff9c4" style="background:#fff9c4"></div>
                    <div class="color-option" data-color="#c5cae9" style="background:#c5cae9"></div>
                    <div class="color-option" data-color="#ffe0b2" style="background:#ffe0b2"></div>
                    <div class="color-option" data-color="#d1c4e9" style="background:#d1c4e9"></div>
                    <div class="color-option" data-color="#b3e5fc" style="background:#b3e5fc"></div>
                    <div class="color-option" data-color="#c8e6c9" style="background:#c8e6c9"></div>
                </div>
                <label for="room-select">おへや</label>
                <div class="room-grid" id="room-select">
                    <div class="room-card selected" data-room="plaza">
                        <div class="room-icon">&#127963;</div>
                        <div class="room-name">ひろば</div>
                        <div class="room-desc">みんなが集まる広場</div>
                    </div>
                    <div class="room-card" data-room="gallery">
                        <div class="room-icon">&#127912;</div>
                        <div class="room-name">ギャラリー</div>
                        <div class="room-desc">アートの展示ホール</div>
                    </div>
                    <div class="room-card" data-room="garden">
                        <div class="room-icon">&#127795;</div>
                        <div class="room-name">ガーデン</div>
                        <div class="room-desc">やすらぎの自然公園</div>
                    </div>
                    <div class="room-card" data-room="lounge">
                        <div class="room-icon">&#9749;</div>
                        <div class="room-name">ラウンジ</div>
                        <div class="room-desc">くつろぎのスペース</div>
                    </div>
                </div>
                <button id="enter-btn" class="enter-button">はいる</button>
            </div>
        </div>
    </div>

    <!-- 3D World -->
    <div id="world-screen" class="hidden">
        <canvas id="metaverse-canvas"></canvas>

        <!-- HUD -->
        <div id="hud">
            <div id="hud-top-left">
                <div id="room-label"></div>
                <div id="user-count">0 online</div>
            </div>
            <div id="hud-top-right">
                <button id="btn-minimap" class="hud-btn" title="Toggle Minimap">Map</button>
                <button id="btn-emote" class="hud-btn" title="Emotes">Emote</button>
                <button id="btn-exit" class="hud-btn" title="Exit to Lobby">Exit</button>
            </div>
            <div id="hud-bottom">
                <div id="controls-hint">WASD: Move &nbsp;|&nbsp; Mouse: Look &nbsp;|&nbsp; Space: Jump &nbsp;|&nbsp; Enter: Chat</div>
            </div>
        </div>

        <!-- Chat -->
        <div id="chat-panel">
            <div id="chat-messages"></div>
            <div id="chat-input-row">
                <input type="text" id="chat-input" placeholder="Type a message..." maxlength="200" autocomplete="off">
                <button id="chat-send-btn">Send</button>
            </div>
        </div>

        <!-- Minimap -->
        <canvas id="minimap-canvas" class="hidden" width="200" height="200"></canvas>

        <!-- Emote Picker -->
        <div id="emote-picker" class="hidden">
            <div class="emote-option" data-emote="wave">&#128075; Wave</div>
            <div class="emote-option" data-emote="dance">&#128131; Dance</div>
            <div class="emote-option" data-emote="sit">&#129682; Sit</div>
            <div class="emote-option" data-emote="clap">&#128079; Clap</div>
        </div>

        <!-- Mobile Controls (hidden by default, shown on touch devices) -->
        <div id="mobile-controls" class="hidden">
            <div id="joystick-area">
                <div id="joystick">
                    <div id="joystick-knob"></div>
                </div>
            </div>
            <div id="mobile-right-buttons">
                <button id="btn-jump" class="mobile-action-btn">Jump</button>
                <button id="btn-chat-toggle" class="mobile-action-btn">Chat</button>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay">
        <div class="loading-spinner"></div>
        <p id="loading-text">Loading...</p>
    </div>

    <!-- Three.js from CDN (with fallback) -->
    <script>
        window.THREE_LOADED = false;
        window.addEventListener('error', function(e) {
            if (e.target && e.target.tagName === 'SCRIPT') {
                document.getElementById('loading-text').textContent =
                    'Failed to load: ' + (e.target.src || 'script') + '. Please refresh.';
                document.getElementById('loading-overlay').style.display = 'flex';
            }
        }, true);
    </script>
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"
            onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'"></script>
    <script>
        if (typeof THREE !== 'undefined') {
            window.THREE_LOADED = true;
        }
    </script>
    <script src="js/utils.js"></script>
    <script src="js/world.js"></script>
    <script src="js/avatar.js"></script>
    <script src="js/controls.js"></script>
    <script src="js/touch.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/npc.js"></script>
    <script src="js/minimap.js"></script>
    <script src="js/sky.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/portals.js"></script>
    <script src="js/interaction.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
