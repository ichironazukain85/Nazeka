<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6c5ce7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nazeka" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="manifest" href="manifest.json" />
    <title>Nazeka - 性格診断で見つける あなたの天職</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Ambient background -->
    <div class="bg-ambient">
      <div class="bg-orb bg-orb--1"></div>
      <div class="bg-orb bg-orb--2"></div>
      <div class="bg-orb bg-orb--3"></div>
    </div>

    <div id="app">
      <!-- スタート画面 -->
      <section id="start-screen" class="screen active">
        <div class="container">
          <div class="hero">
            <div class="logo-mark">N</div>
            <h1>Nazeka</h1>
            <p class="tagline">性格診断で見つける、あなたの天職</p>
            <p class="description">
              12の質問に答えるだけで、あなたの性格タイプを分析し<br />
              最適な仕事をご提案します
            </p>
            <button id="start-btn" class="btn btn-primary" onclick="startQuiz()">
              診断をはじめる
            </button>
            <p class="note">所要時間：約3分 ｜ 全12問</p>
          </div>
        </div>
      </section>

      <!-- 質問画面 -->
      <section id="quiz-screen" class="screen">
        <div class="container">
          <div class="quiz-header">
            <button id="back-btn" class="back-btn" onclick="goBack()" disabled>
              &#8592;
            </button>
            <div class="progress-wrapper">
              <div class="progress-bar">
                <div id="progress-fill" class="progress-fill"></div>
              </div>
            </div>
          </div>
          <p id="progress-text" class="progress-text">1 / 12</p>

          <div id="question-card" class="question-card">
            <div id="question-category" class="question-category"></div>
            <h2 id="question-text" class="question-text"></h2>
            <div id="options-container" class="options-container"></div>
          </div>
        </div>
      </section>

      <!-- 分析中画面 -->
      <section id="analyzing-screen" class="screen">
        <div class="container">
          <div class="analyzing">
            <div class="pulse-container">
              <div class="pulse-ring"></div>
              <div class="pulse-ring"></div>
              <div class="pulse-ring"></div>
              <div class="pulse-core"></div>
            </div>
            <h2>あなたの性格を分析中...</h2>
            <p id="analyzing-text">回答を集計しています</p>
          </div>
        </div>
      </section>

      <!-- 結果画面 -->
      <section id="result-screen" class="screen">
        <canvas id="confetti-canvas"></canvas>
        <div class="container">
          <div class="result-header">
            <p class="result-label">あなたの性格タイプは</p>
            <div id="result-emoji" class="result-emoji"></div>
            <h1 id="result-type-name" class="result-type-name"></h1>
            <span id="result-type-code" class="result-type-code"></span>
          </div>

          <div class="result-description">
            <p id="result-description-text"></p>
          </div>

          <div class="result-section">
            <h3>
              <span class="section-icon section-icon--strengths">&#9733;</span>
              あなたの強み
            </h3>
            <div id="strengths-list" class="strengths-list"></div>
          </div>

          <div class="result-section">
            <h3>
              <span class="section-icon section-icon--scores">&#9670;</span>
              性格スコア
            </h3>
            <div id="dimension-chart" class="dimension-chart"></div>
          </div>

          <div class="result-section">
            <h3>
              <span class="section-icon section-icon--jobs">&#9733;</span>
              あなたにおすすめの仕事
            </h3>
            <div id="jobs-list" class="jobs-list"></div>
          </div>

          <div class="result-actions">
            <button class="btn btn-primary" onclick="resetQuiz()">
              もう一度診断する
            </button>
            <button class="btn btn-secondary" onclick="shareResult()">
              結果をシェア
            </button>
          </div>
        </div>
      </section>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
